name: Keep Supabase awake

# Free-tier Supabase project 7 din bina activity ke pause ho jata hai.
# Ye workflow rozana ek halki si query bhejta hai, isliye wo kabhi us
# limit tak nahi pahunchta. App seasonal hai -- Holi ke baad mahino
# band rahega -- isliye ye zaroori hai, warna har baar "Failed to
# fetch" milega aur lagega ki app toot gaya.
on:
  schedule:
    - cron: '17 4 * * *'      # rozana 09:47 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # ping() RPC call kar rahe hain, kisi table ko nahi. anon ko
          # koi table padhne ka haq jaan boojh kar nahi diya gaya --
          # usme chhed karna is app ki security kam kar deta. ping()
          # sirf 'ok' lautata hai, par DB round trip asli hai.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $code"
          # 200 = project chalu. Kuch aur = paused ya secret galat.
          [ "$code" = "200" ]
