name: Keep Supabase awake

# Free-tier Supabase project 7 din bina activity ke pause ho jata hai.
# Ye workflow rozana ek halki si query bhejta hai, isliye wo kabhi us
# limit tak nahi pahunchta. App seasonal hai -- Holi ke baad mahino
# band rahega -- isliye ye zaroori hai, warna har baar "Failed to
# fetch" milega aur lagega ki app toot gaya.
on:
  schedule:
    - cron: '17 4 * * *'      # rozana 09:47 IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/companies?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          # 200 = project chalu. Kuch aur = paused ya secret galat.
          [ "$code" = "200" ]
